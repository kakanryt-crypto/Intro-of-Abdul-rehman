name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Download Gradle
      run: |
        wget https://gradle.org
        sudo unzip -d /opt/gradle gradle-8.2-bin.zip
        export PATH=$PATH:/opt/gradle/gradle-8.2/bin
        echo "/opt/gradle/gradle-8.2/bin" >> $GITHUB_PATH

    - name: Build APK with Global Gradle
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: abdul-rehman-app-v1.0
        path: "**/build/outputs/apk/debug/*.apk"
